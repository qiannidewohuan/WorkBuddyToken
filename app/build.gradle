plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.workbuddy.token'
    compileSdk 34

    defaultConfig {
        applicationId 'cn.workbuddy.token'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 复用 debug 签名，方便直接安装，不需要额外配置 keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 零第三方依赖：HttpURLConnection / org.json / AndroidKeyStore 均为系统自带
dependencies {
}
